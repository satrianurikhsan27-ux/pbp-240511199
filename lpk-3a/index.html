
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>To-Do List</h1>
        <p class="subtitle">Catat dan kelola tugas harianmu</p>

        <form id="form-todo">
            <input
                type="text"
                id="input-todo"
                placeholder="Tulis tugas baru..."
                required
            >
            <button type="submit">Tambah</button>
        </form>

        <p id="stats">0 tugas belum selesai</p>

        <ul id="list-todo"></ul>
    </main>

    <script src="app.js"></script>
</body>
</html>
